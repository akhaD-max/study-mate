{% extends "base.html" %}

{% block title %}Вход — StudyMate{% endblock %}

{% block content %}
<h1>Вход</h1>

<form method="post" action="{% url 'accounts:login' %}">
    {% csrf_token %}

    {{ form.as_p }}

    <input type="hidden" name="next" value="{{ next }}">

    <button type="submit">Войти</button>
</form>

<p>
    Нет аккаунта?
    <a href="{% url 'accounts:register' %}">Зарегистрироваться</a>
</p>
{% endblock %}
