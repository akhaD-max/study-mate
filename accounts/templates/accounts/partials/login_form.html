<div id="auth-form">
    <h2 id="auth-title" tabindex="-1">С возвращением!</h2>
    <p class="auth-subtitle">Здесь начинается твой следующий проект.</p>
    <form method="post" action="{% url 'accounts:login' %}" hx-post="{% url 'accounts:login' %}" hx-target="#auth-form" hx-swap="outerHTML" hx-disabled-elt="find button[type='submit']">
        {% csrf_token %}
        {% include "accounts/partials/fields.html" %}
        <input type="hidden" name="next" value="{{ next }}">
        <p class="auth-hint">Используем email для входа в аккаунт.</p>
        <button class="auth-submit" type="submit">Войти <span aria-hidden="true">→</span></button>
        <p class="auth-network-error" role="alert" hidden>Не удалось отправить форму. Проверь соединение и попробуй ещё раз.</p>
    </form>
    <p class="auth-switch">Первый раз здесь? <a href="{% url 'accounts:register' %}">Зарегистрироваться</a></p>
</div>
