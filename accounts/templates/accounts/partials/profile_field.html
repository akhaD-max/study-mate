<div class="profile-field{% if wide %} profile-field-wide{% endif %}{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="profile-field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="profile-field-error" role="alert">{{ error }}</p>{% endfor %}
</div>
