<section id="application-form" aria-live="polite" class="pg-apply-card">
    <div class="state-card">
        <div class="state-bar state-bar-lime" aria-hidden="true"></div>
        <h2>Заявка отправлена</h2>
        <p>{{ application.project.title }} · {{ application.role.name }}</p>
        <p>Автор проекта получил ваш отклик.<br>Следите за статусом в «Моих заявках».</p>
        <span class="pg-badge pg-badge-review state-badge">{{ application.get_status_display }}</span>
        <a class="state-btn" href="{% url 'applications:mine' %}">Перейти к заявкам</a>
    </div>
</section>
