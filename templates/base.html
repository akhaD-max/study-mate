{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}StudyMate{% endblock %}</title>
    <script src="{% static 'vendor/htmx-2.0.11.min.js' %}" defer></script>
</head>
<body>
    <nav>
        <a href="{% url 'main:home' %}">Главная</a>

        {% if user.is_authenticated %}
            <span class="user-info">Вы вошли как {{ user.email }}</span>
            <a href="{% url 'accounts:logout' %}">Выход</a>
        {% else %}
            <a href="{% url 'accounts:register' %}">Регистрация</a>
            <a href="{% url 'accounts:login' %}">Вход</a>
        {% endif %}
    </nav>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
